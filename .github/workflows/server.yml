name: Frogbot server

on:
  pull_request:
    paths: ["server/**", "utils/codexQuota.ts", "utils/codexPoolProtocol.ts", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["server/**", "utils/codexQuota.ts", "utils/codexPoolProtocol.ts", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec wrangler deploy --dry-run
